<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>ChatTeman</title>

  <!-- Framework7 (lokal, hasil copy build.js dari node_modules) -->
  <link rel="stylesheet" href="assets/framework7/framework7-bundle.min.css" />
  <link rel="stylesheet" href="assets/framework7/framework7-icons.css" />

  <!-- App CSS -->
  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="css/theme.css" />
</head>
<body>
  <div id="app">
    <div class="view view-main safe-areas">
      <div class="page">
        <div class="page-content">

          <!-- ============ HALAMAN LOGIN ============ -->
          <div id="page-login" class="chatteman-page">
            <div class="login-wrap">
              <h1>ChatTeman</h1>
              <p class="login-subtitle">Masuk untuk mulai cari teman terdekat</p>

              <form id="login-form">
                <div class="list no-hairlines-md">
                  <ul>
                    <li class="item-content item-input">
                      <div class="item-inner">
                        <div class="item-title item-label">Username / Email</div>
                        <div class="item-input-wrap">
                          <input type="text" id="login-username" name="username" required autocomplete="username" />
                        </div>
                      </div>
                    </li>
                    <li class="item-content item-input">
                      <div class="item-inner">
                        <div class="item-title item-label">Password</div>
                        <div class="item-input-wrap">
                          <input type="password" id="login-password" name="password" required autocomplete="current-password" />
                        </div>
                      </div>
                    </li>
                  </ul>
                </div>

                <p id="login-error" class="chip offline" style="display:none;"></p>

                <button type="submit" id="login-submit" class="button button-fill button-large">
                  Masuk
                </button>
              </form>
            </div>
          </div>

          <!-- ============ HALAMAN NEARBY ============ -->
          <div id="page-nearby" class="chatteman-page" style="display:none;">
            <div class="nearby-header">
              <div>
                <strong id="nearby-username">-</strong>
                <p id="network-status" class="chip">Mengecek koneksi...</p>
              </div>
              <button id="logout-btn" class="button button-small">Keluar</button>
            </div>

            <div class="nearby-actions">
              <button id="update-location-btn" class="button button-fill">
                Perbarui Lokasi Saya
              </button>
              <button id="refresh-list-btn" class="button button-outline">
                Muat Ulang Daftar
              </button>
            </div>

            <p id="nearby-status" class="chip" style="display:none;"></p>

            <div id="nearby-list" class="nearby-list">
              <!-- Kartu user terdekat dirender via JS (nearby.js + app.js) -->
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>

  <!-- Framework7 (lokal) -->
  <script src="assets/framework7/framework7-bundle.min.js"></script>

  <!-- App JS -->
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/nearby.js"></script>
  <script src="js/messages.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
